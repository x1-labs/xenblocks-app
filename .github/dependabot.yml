version: 2
updates:
  # The bun ecosystem, not npm. npm would update package.json without touching
  # bun.lock, and every install here is --frozen-lockfile, so each such PR would
  # fail CI. The bun ecosystem keeps the two in sync.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # The Solana packages move together and are only useful reviewed together.
      solana:
        patterns:
          - "@solana/*"
          - "@coral-xyz/*"
          - "@sqds/*"
      dev-toolchain:
        patterns:
          - "@eslint/*"
          - "eslint*"
          - "typescript*"
          - "prettier"
          - "vite"
          - "@vitejs/*"
          - "@types/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
