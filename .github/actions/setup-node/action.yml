name: "Setup Node and Bun"
description: "Installs Node and Bun, then installs dependencies from the lockfile."

inputs:
  node-version:
    description: "Node.js version"
    required: false
    default: "24"
  bun-version:
    description: "Bun version"
    required: false
    default: "1.3.14"

runs:
  using: "composite"
  steps:
    # Node is the runtime the toolchain targets; bun is the package manager and
    # script runner. No `cache:` input here -- bun manages its own cache.
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    # --frozen-lockfile so a dependency can never silently re-resolve in CI.
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
